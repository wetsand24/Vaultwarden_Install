services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.example.com"   # change to your domain
      SIGNUPS_ALLOWED: "true"               # set to "false" after you create your account
    volumes:
      - ./vw-data:/data
    ports:
      - "8080:80"
